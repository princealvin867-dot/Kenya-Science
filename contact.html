<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenya Science | Contact</title>
</head>
<body>
    <header>
        <div class="topbar">
            <h1>Kenya Science</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="courses.html">Courses</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="card">
            <h2>Contact Us</h2>
            <p>If you have any questions or would like to learn more about our programs, please feel free to contact us:</p>

            <form>
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" type="text" name="name" placeholder="Enter your name">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="Enter your email">
                </div>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here..."></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>

            <div class="contact-details">
                <p><strong>Email:</strong> info@kenyascience.ac.ke</p>
                <p><strong>Phone:</strong> +254 700 123 456</p>
                <p><strong>Address:</strong> Nairobi, Kenya</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kenya Science. All rights reserved.</p>
    </footer>
</body>
</html>
